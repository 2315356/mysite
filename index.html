<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환영합니다</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #e0ecff, #f7f9fc);
      color: #222;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 24px; font-size: 1.5rem; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid #ccd3df;
      border-radius: 8px;
    }
    input:focus { outline: 2px solid #3b6ef5; border-color: transparent; }
    button {
      padding: 12px 18px;
      font-size: 1rem;
      color: #fff;
      background: #3b6ef5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #2c58d6; }
    #message {
      margin: 24px 0 0;
      min-height: 1.5em;
      font-size: 1.25rem;
      font-weight: bold;
      color: #3b6ef5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>이름을 입력하세요</h1>
    <form id="nameForm">
      <input type="text" id="nameInput" placeholder="이름" autocomplete="name" required>
      <button type="submit">확인</button>
    </form>
    <p id="message"></p>
  </main>

  <script>
    const form = document.getElementById("nameForm");
    const input = document.getElementById("nameInput");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) {
        message.textContent = "이름을 입력해 주세요.";
        return;
      }
      // textContent를 사용해 입력값이 HTML로 해석되지 않도록 함
      message.textContent = `${name} 님 어서오세요`;
    });
  </script>
</body>
</html>
